spring:
  application:
    name: demo-banking-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/demo_banking?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
app:
  auth:
    token-ttl-minutes: 60
    signing-secret: ${JWT_SIGNING_SECRET:}
  demo-data:
    enabled: ${DEMO_DATA_ENABLED:true}
